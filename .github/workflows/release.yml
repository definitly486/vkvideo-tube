name: Build tagged release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine release tag
        shell: bash
        run: |
          app_version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$app_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$app_version" = "$GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
          else
            tag="${app_version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install APK packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends advancecomp zip unzip
          advzip --version

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/0w-tube-release.jks"

      - name: Test, lint, and build unsigned release
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon

      - name: Test search prototype
        run: python3 -m unittest research.test_peertube_search_prototype

      - name: Preserve crash symbol mapping
        uses: actions/upload-artifact@v7
        with:
          name: 0W-Tube-${{ env.RELEASE_TAG }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Compress, align, and sign release once
        shell: bash
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/0w-tube-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          test -x "$zipalign"
          test -x "$apksigner"

          mkdir -p dist
          optimized="$RUNNER_TEMP/0W-Tube-${RELEASE_TAG}-optimized.apk"
          aligned="$RUNNER_TEMP/0W-Tube-${RELEASE_TAG}-aligned.apk"
          output="dist/0W-Tube-${RELEASE_TAG}.apk"

          cp "$unsigned" "$optimized"
          advzip -z -4 "$optimized"

          # Android 11+ rejects APKs whose resource table is compressed.
          stored_resources="$RUNNER_TEMP/stored-resources"
          mkdir -p "$stored_resources"
          unzip -o -j "$optimized" resources.arsc -d "$stored_resources"
          zip -d "$optimized" resources.arsc
          (cd "$stored_resources" && zip -0 -X "$optimized" resources.arsc)
          unzip -lv "$optimized" resources.arsc | grep -q 'Stored.*resources.arsc'

          "$zipalign" -P 16 -f 4 "$optimized" "$aligned"
          "$apksigner" sign \
            --ks "$RELEASE_KEYSTORE_PATH" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$output" \
            "$aligned"

          "$zipalign" -c -P 16 -v 4 "$output"
          "$apksigner" verify --verbose "$output"
          unzip -lv "$output" resources.arsc | grep -q 'Stored.*resources.arsc'

          cd dist
          sha256sum "0W-Tube-${RELEASE_TAG}.apk" > "0W-Tube-${RELEASE_TAG}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: 0W-Tube-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/0W-Tube-${RELEASE_TAG}.apk"
            "dist/0W-Tube-${RELEASE_TAG}.apk.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease=()
            case "$RELEASE_TAG" in *-*) prerelease=(--prerelease) ;; esac
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              target=(--verify-tag)
            else
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${prerelease[@]}" \
              "${target[@]}" \
              --generate-notes \
              --title "0W-Tube ${RELEASE_TAG}"
          fi
