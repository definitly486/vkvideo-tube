name: Diagnose build
on:
  push:
    branches: [feature/channels-tab]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test, report errors as annotations
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|What went wrong|FAILED|Lint found|Error:|\.java:[0-9]+" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-400)"
            done
          fi
          exit $code
